<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
  </head>
  <body>
    <main>
      <header class="toolbar">
        <h1></h1>
        <div class="controls">
          <button type="button" id="walk" disabled></button>
          <button type="button" id="pause" aria-pressed="false" disabled></button>
        </div>
      </header>
      <div id="scene" class="scene" data-coworking="loading">
        <canvas id="room" aria-describedby="hint"></canvas>
        <canvas id="screen-details" aria-hidden="true"></canvas>
        <div id="monitors"></div>
        <p id="loading" role="status"></p>
      </div>
      <p id="hint"></p>
    </main>
    <dialog id="screen" aria-labelledby="screen-title">
      <div id="computer"></div>
    </dialog>
    <script type="module" src="./coworking/main.ts"></script>
  </body>
</html>
